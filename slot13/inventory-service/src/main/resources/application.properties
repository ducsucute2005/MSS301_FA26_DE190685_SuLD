server.port=8082
spring.application.name=inventory-service

# Spring Boot 4: spring.data.mongodb.uri -> spring.mongodb.uri
# Chay trong Docker se duoc ghi de bang bien moi truong MONGO_URI
spring.mongodb.uri=mongodb://admin:123456@localhost:27017/inventorydb?authSource=admin
# Spring Boot 4: server.error.include-message -> spring.web.error.include-message
spring.web.error.include-message=always
